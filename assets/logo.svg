<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DF95" />
      <stop offset="50%" stop-color="#D4A62F" />
      <stop offset="100%" stop-color="#9E7310" />
    </linearGradient>
    <linearGradient id="goldGradLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4A62F" />
      <stop offset="100%" stop-color="#FFF2B8" />
    </linearGradient>
    <linearGradient id="navyFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3253" />
      <stop offset="100%" stop-color="#0F1A2D" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Hexagonal / Diamond Emblem Base -->
  <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" fill="url(#navyFacet)" stroke="url(#goldGrad)" stroke-width="2" filter="url(#subtleShadow)"/>

  <!-- Subtle Inner Accent Ring -->
  <polygon points="50,9 86,28 86,72 50,91 14,72 14,28" fill="none" stroke="rgba(212, 166, 47, 0.2)" stroke-width="1"/>

  <!-- Geometric Luxury Numeral '4' -->
  <!-- Left diagonal upright of 4 -->
  <polygon points="54,20 44,20 23,62 38,62" fill="url(#goldGradLight)"/>
  
  <!-- Horizontal crossbar of 4 -->
  <polygon points="21,60 76,60 76,69 21,69" fill="url(#goldGrad)"/>

  <!-- Right vertical stem of 4 -->
  <polygon points="57,32 68,32 68,80 57,80" fill="url(#goldGrad)"/>

  <!-- Geometric Bevel Accent on Intersection -->
  <polygon points="57,60 68,60 68,69 57,69" fill="#FFF4CA"/>
</svg>
